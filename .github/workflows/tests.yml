name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        run: bash -n archive.sh audio.sh copy.sh image.sh video.sh tests/archive-test.sh tests/mock-converter.sh tests/integration-test.sh
      - name: Run regression tests
        run: |
          command -v setsid
          env --default-signal=INT true
          bash tests/archive-test.sh

  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      IMAGEMAGICK_VERSION: 7.1.2-35
      IMAGEMAGICK_SHA256: 40b6fefa88fe16ca5a4b3d3db5133eaebfb0157f21f98530bde8aec5dd5b0776
      LIBULTRAHDR_VERSION: 2.0.2
      LIBULTRAHDR_SHA256: aa8d193bb887c348c419780511dd03b374f4e07af8812b6d3f80c8537cf1ef2c
    steps:
      - uses: actions/checkout@v7
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libimage-exiftool-perl libjxl-tools build-essential cmake ca-certificates curl pkg-config \
            libjxl-dev libjpeg-dev libpng-dev libheif-dev \
            libheif-plugin-x265 libheif-plugin-libde265 liblcms2-dev libxml2-dev
      - name: Cache ImageMagick binaries and libraries
        id: imagemagick-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/imagemagick
          key: imagemagick-${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-${{ env.IMAGEMAGICK_VERSION }}-${{ env.IMAGEMAGICK_SHA256 }}-${{ hashFiles('.github/workflows/tests.yml') }}
      - name: Build pinned libultrahdr
        if: steps.imagemagick-cache.outputs.cache-hit != 'true'
        run: |
          build_dir=$(mktemp -d)
          curl --fail --location --retry 3 \
            "https://github.com/google/libultrahdr/archive/refs/tags/v${LIBULTRAHDR_VERSION}.tar.gz" \
            -o "$build_dir/libultrahdr.tar.gz"
          printf '%s  %s\n' "$LIBULTRAHDR_SHA256" "$build_dir/libultrahdr.tar.gz" | sha256sum --check --strict
          tar -xzf "$build_dir/libultrahdr.tar.gz" -C "$build_dir"
          cmake -S "$build_dir/libultrahdr-${LIBULTRAHDR_VERSION}" -B "$build_dir/build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local/imagemagick" \
            -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON \
            -DUHDR_BUILD_EXAMPLES=OFF -DUHDR_BUILD_TESTS=OFF -DUHDR_ENABLE_HEIF=OFF
          cmake --build "$build_dir/build" --parallel "$(nproc)"
          cmake --install "$build_dir/build"
      - name: Build pinned ImageMagick
        if: steps.imagemagick-cache.outputs.cache-hit != 'true'
        run: |
          build_dir=$(mktemp -d)
          curl --fail --location --retry 3 \
            "https://github.com/ImageMagick/ImageMagick/archive/refs/tags/${IMAGEMAGICK_VERSION}.tar.gz" \
            -o "$build_dir/imagemagick.tar.gz"
          printf '%s  %s\n' "$IMAGEMAGICK_SHA256" "$build_dir/imagemagick.tar.gz" | sha256sum --check --strict
          tar -xzf "$build_dir/imagemagick.tar.gz" -C "$build_dir"
          cd "$build_dir/ImageMagick-${IMAGEMAGICK_VERSION}"
          PKG_CONFIG_PATH="$HOME/.local/imagemagick/lib/pkgconfig" \
          LD_LIBRARY_PATH="$HOME/.local/imagemagick/lib" \
          ./configure --prefix="$HOME/.local/imagemagick" --disable-static \
            --without-magick-plus-plus --without-perl --without-x \
            --with-jxl=yes --with-heic=yes --with-jpeg=yes --with-png=yes \
            --with-lcms=yes --with-xml=yes --with-uhdr=yes
          make -j"$(nproc)"
          make install
      - name: Activate ImageMagick installation
        run: |
          echo "$HOME/.local/imagemagick/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.local/imagemagick/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Verify pinned ImageMagick and required formats
        run: |
          magick -version
          magick -version | grep -F "ImageMagick ${IMAGEMAGICK_VERSION} "
          formats=$(magick -list format)
          for format in HEIC JPEG JXL PNG UHDR; do
            grep -E "^[[:space:]]*${format}[*]?[[:space:]]+([^[:space:]]+[[:space:]]+)?rw[+-][[:space:]]" <<< "$formats" || {
              printf 'Missing read/write support for %s\n%s\n' "$format" "$formats" >&2
              exit 1
            }
          done
      - name: Run integration tests
        run: bash tests/integration-test.sh
